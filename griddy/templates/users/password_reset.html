{% extends '_base.html' %}
{% load crispy_forms_filters %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{%  trans "Password Reset" %}{% endblock %}

{% block content %}
<h2>Passwort vergessen?</h2>
<form method="POST" class="password_reset">
  {% csrf_token %}
  {{ form | crispy }}
  <button class="btn btn-primary" type="submit">{%  trans "Passwort zurücksetzen" %}</button>
</form>
{% endblock content %}
