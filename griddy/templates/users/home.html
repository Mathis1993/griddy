{% extends '_base.html' %}
{% load static %}

{% block title %}Home page{% endblock title %}

{% block content %}
<!-- Icon Blocks -->
<div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
  <div class="grid sm:grid-cols-2 lg:grid-cols-4 items-center gap-2">
    <!-- Icon Block -->
    <a class="group flex flex-col justify-center hover:bg-gray-50 rounded-xl p-4 md:p-7 dark:hover:bg-neutral-800"
       href="{% url 'devices:list_heat_pump_integrations' %}">
      <div class="flex justify-center items-center size-12 bg-blue-600 rounded-xl">
        <svg class="flex-shrink-0 size-6 text-white"
             xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <rect width="10"
                height="14"
                x="3"
                y="8"
                rx="2"/>
          <path d="M5 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-2.4"/>
          <path d="M8 18h.01"/>
        </svg>
      </div>
      <div class="mt-5">
        <h3
              class="group-hover:text-gray-600 text-lg font-semibold text-gray-800 dark:text-white dark:group-hover:text-gray-400">
          Gerät hinzufügen</h3>
        <p class="mt-1 text-gray-600 dark:text-neutral-400">Richte deine Wärmepumpe ein</p>
      </div>
    </a>
    <!-- End Icon Block -->
  </div>
</div>
<!-- End Icon Blocks -->


{% endblock content %}
