{% extends '_base.html' %}
{% load static %}

{% block title %}Home page{% endblock title %}

{% block content %}
    <img src="{% static 'images/griddy.webp' %}" alt="griddy" class="img-fluid" style="width: 20%; height: 20%">
    <div class="row">
    <div class="col-8 d-flex align-items-center">
        {% if user.is_authenticated and user.first_name %}
            <div style="font-size: 36px;" class="fw-bold">Hallo {{ user.first_name }}!</div>
        {% else %}
            <div style="font-size: 36px;" class="fw-bold">Willkomen!</div>
        {% endif %}
    </div>
    </div>


{% endblock content %}
