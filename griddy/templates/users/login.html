{% extends '_base.html' %}
{% load crispy_forms_filters %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Anmeldung{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
  <a href="#"
     class="flex items-center mb-6 text-2xl font-semibold text-gray dark:text-white">
    <img class="w-8 h-8 mr-2"
         src="{% static 'images/griddy.webp' %}"
         alt="logo">
    Griddy
  </a>
  <div class="w-full rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
      <h1 class="text-xl font-bold md:text-2xl mb-3">Anmeldung</h1>
      <form method="post"
            action="{% url 'users:login' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="link link-neutral link-hover mb-5">
          <a class="small"
             href="{% url 'users:reset_password' %}">Passwort vergessen?</a>
        </div>
        <input type="submit"
               value="Anmelden"
               class="btn btn-primary w-full mb-5">
        <input type="hidden"
               name="next"
               value="{{ next }}">
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          Noch keinen Account? <a href="{% url 'users:signup' %}"
                                  class="font-medium text-primary-600 hover:underline dark:text-primary-500">Registrieren</a>
        </p>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
