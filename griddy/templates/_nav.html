{% load static %}

<!-- Header -->
<header class="sticky top-0 z-50 w-full backdrop-blur-lg bg-white/10 border-b border-white/20">
  <nav class="px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo/Home Link -->
            <a href="{% url 'electricity_rates:landing' %}"
         class="flex items-center gap-3 text-white">
        <img src="{% static 'images/griddy.webp' %}"
             alt="Griddy Logo"
             class="h-10 w-auto rounded"> <!-- Adjust h-8 to your needs -->
        <span class="font-semibold text-lg hidden sm:inline-block">Griddy - Dein Stromtarif Rechner</span>
        <span class="font-semibold text-lg sm:hidden">Griddy</span> <!-- Mobile version -->
      </a>

      <!-- Navigation Items -->
      <div class="hidden sm:flex space-x-6">
        <a href="{% url 'electricity_rates:landing' %}"
           class="text-white/90 hover:text-white transition-colors">
          Home
        </a>
        <a href="{% url 'electricity_rates:calculator' %}"
           class="text-white/90 hover:text-white transition-colors">
          Rechner
        </a>
        <a href="#"
           class="text-white/90 hover:text-white transition-colors">
          FAQ
        </a>
        <a href="#"
           class="text-white/90 hover:text-white transition-colors">
          Tarifangebote
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button type="button"
              class="sm:hidden text-white"
              data-hs-overlay="#mobile-menu">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7"/>
        </svg>
      </button>
    </div>
  </nav>
</header>

<!-- Mobile Menu Overlay -->
<div id="mobile-menu"
     class="hs-overlay hidden w-full h-full fixed top-0 left-0 z-[60]"
     data-hs-overlay-keyboard="true">
  <!-- Backdrop with click handler -->
  <div class="hs-overlay-backdrop fixed inset-0 bg-black bg-opacity-60 z-[60]"
       data-hs-overlay="#mobile-menu"></div>
  <!-- Menu Content -->
  <div class="relative z-[61] p-4 mt-16">
    <div class="flex flex-col space-y-4 bg-white/10 backdrop-blur-lg rounded-lg p-4">
      <a href="{% url 'electricity_rates:landing' %}"
         class="text-white hover:text-white/80 transition-colors">
        Home
      </a>
      <a href="{% url 'electricity_rates:calculator' %}"
         class="text-white hover:text-white/80 transition-colors">
        Rechner
      </a>
      <a href="#"
         class="text-white/90 hover:text-white transition-colors">
        FAQ
      </a>
      <a href="#"
         class="text-white/90 hover:text-white transition-colors">
        Tarifangebote
      </a>
    </div>
  </div>
</div>
