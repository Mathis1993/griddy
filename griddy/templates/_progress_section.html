<!-- Progress Section -->
  <div
        id="progress-section"
        hx-swap-oob="true"
  >
    <div class="w-full h-1.5 bg-gradient-to-r from-gray-400 via-gray-300 to-gray-400 rounded-full overflow-hidden dark:from-neutral-800 dark:via-neutral-700 dark:to-neutral-800">
      <div class="h-full bg-gradient-to-r from-green-500 via-green-600 to-green-500 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(59,130,246,0.5)] dark:shadow-[0_0_10px_rgba(59,130,246,0.3)]"
           style="width: {{ progress_percentage }}%"
           role="progressbar"
           aria-valuenow="{{ progress_percentage }}"
           aria-valuemin="0"
           aria-valuemax="100">
      </div>
    </div>
  </div>
