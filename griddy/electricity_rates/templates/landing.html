{% extends '_base.html' %}

{% block content %}
    <!-- Content Container -->
    <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
        <!-- Glass Effect Card -->
        <div class="backdrop-blur-lg bg-white/10 rounded-3xl p-8 sm:p-12 shadow-2xl border border-white/20">
            <!-- Main Heading -->
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-8 leading-tight">
                Lohnt sich ein dynamischer Stromtarif für mich?
            </h1>

            <!-- Description Text -->
            <p class="text-lg sm:text-xl text-white/90 mb-10 max-w-2xl mx-auto">
                Finde heraus, wie viel du mit einem dynamischen Stromtarif sparen kannst.
            </p>

            <!-- CTA Button -->
            <a href="{% url 'electricity_rates:calculator' %}" class="inline-flex items-center justify-center px-8 py-4 text-lg font-semibold text-white bg-gradient-to-r from-gray-600 to-green-600 rounded-full transition-transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 shadow-lg hover:shadow-xl">
                <span>Jetzt Einsparpotenzial berechnen</span>
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </a>
        </div>
    </div>
{% endblock %}
