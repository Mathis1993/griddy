<form
      hx-post=""
      hx-swap="outerHTML"
>
  {% csrf_token %}
  <div class="relative z-10 flex flex-col gap-x-3 p-3 bg-white border rounded-lg shadow-lg shadow-gray-100 dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-gray-900/20">
  <!-- First row: Input and button -->
    <div class="flex gap-x-3 p-3">
    <div class="w-full">
      <label for={{ field.id_for_label }}
             class="block text-gray-500 dark:text-neutral-500 {% if show_label %}mb-2{% endif %}"><span {% if not show_label %}class="sr-only"{% endif %}>{{ field.label }}</span></label>
      {{ field }}
    </div>
    <div>
      <button class="size-[46px] inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
              type="submit">
        <svg xmlns="http://www.w3.org/2000/svg"
             height="24px"
             viewBox="0 -960 960 960"
             width="24px"
             fill="#FFFFFF">
          <path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z"/>
        </svg>
      </button>
    </div>
  </div>
  <!-- Second row: Error messages -->
  {% if field.errors %}
  <div class="px-3 pb-3">
    <ul class="errorlist mt-2 text-left text-red-600">
      {% for error in field.errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
  </div>
</form>
